<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雪投げタイム コンセプトデモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 雪の朝の住宅街。1画面アプリ：上に「自宅のいまの状態」、中央に地図、下に手順と再生操作。 */
  --snow:#eef2f6;      /* 画面の地色（積雪） */
  --paper:#ffffff;     /* パネル */
  --ink:#132231;       /* 文字・待機状態 */
  --slate:#5a6c7f;     /* 補助文字 */
  --line:#d3dbe4;      /* 罫線 */
  --plow:#f6b400;      /* 除雪車の黄色 */
  --go:#d9480f;        /* 雪出しOK（警戒色オレンジ） */
  --done:#17697a;      /* 除雪済み */
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --font-num:"Barlow Semi Condensed","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--snow);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(180px,1fr) auto;grid-template-areas:"brand" "status" "map" "panel"}

.brand{grid-area:brand;display:flex;flex-direction:column;gap:2px;padding:9px 16px 7px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;gap:8px}
.mark{width:26px;height:26px;flex:none}
.brand h1{font-size:19px;font-weight:900;letter-spacing:.02em;line-height:1.2}
.pill{margin-left:auto;font-size:11px;font-weight:700;color:var(--slate);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.lead{font-size:13px;color:var(--ink);text-wrap:balance}
.lead b{font-weight:900;background:linear-gradient(transparent 62%,rgba(246,180,0,.55) 62%)}

.status{grid-area:status;position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:11px 16px 10px;color:#fff;background:var(--ink);transition:background-color .35s}
.status[data-state="go"]{background:var(--go)}
.status[data-state="done"]{background:var(--done)}
.status::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(-45deg,var(--plow) 0 10px,#1b1b1b 10px 20px);opacity:0;transition:opacity .3s}
.status[data-state="go"]::before{opacity:1}
.st-chip{grid-column:1;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;opacity:.92}
.st-chip i{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.status[data-state="go"] .st-chip i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.st-head{grid-column:1;font-size:19px;font-weight:900;line-height:1.25;text-wrap:balance}
.st-sub{grid-column:1;font-size:12.5px;opacity:.9}
.st-count{grid-column:2;grid-row:1 / span 3;text-align:right;min-width:92px}
.st-count small{display:block;font-size:11px;font-weight:700;opacity:.85}
.st-count strong{display:block;font-family:var(--font-num);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.st-bar{grid-column:1 / -1;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:4px}
.st-bar span{display:block;height:100%;width:0;background:#fff;border-radius:3px}

.mapwrap{grid-area:map;position:relative;overflow:hidden;background:#e8edf2;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map:active{cursor:grabbing}
.toast{position:absolute;left:12px;right:12px;top:10px;max-width:420px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 6px 24px rgba(19,34,49,.22),0 0 0 1px rgba(19,34,49,.08);transform:translateY(-140%);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .25s;pointer-events:none}
.toast.show{transform:none;opacity:1}
.toast .ic{grid-row:1 / span 2;width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.toast .ic svg{width:22px;height:22px}
.toast .meta{font-size:11px;color:var(--slate);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.toast .msg{font-size:13px;line-height:1.4}
.toast .msg b{font-weight:900}
.legend{position:absolute;left:10px;bottom:30px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 20px);padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.9);font-size:11px;font-weight:700;color:var(--ink);box-shadow:0 0 0 1px rgba(19,34,49,.08)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;width:20px;height:5px;border-radius:3px}
.lg-wait{background:repeating-linear-gradient(90deg,var(--slate) 0 5px,transparent 5px 8px)}
.lg-go{background:var(--go);height:7px !important}
.lg-done{background:#2b8fa3}
.lg-pile{width:9px !important;height:9px !important;border-radius:50% !important;background:#fff;border:1.5px solid var(--slate)}
.mapfoot{position:absolute;left:10px;right:10px;bottom:6px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:10px;color:var(--slate);pointer-events:none}
.scale{display:flex;align-items:center;gap:5px;font-family:var(--font-num);font-weight:600;font-size:11px}
.scale i{display:block;height:5px;border:1.5px solid var(--slate);border-top:0;width:60px}
.mapfoot a{color:inherit;pointer-events:auto}

.panel{grid-area:panel;background:var(--paper);border-top:1px solid var(--line);padding:9px 16px 10px;display:flex;flex-direction:column;gap:7px}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps li{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;border:1.5px solid var(--line);font-size:12px;font-weight:700;line-height:1.3;color:var(--slate);transition:background-color .3s,color .3s,border-color .3s}
.steps li b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-num);font-size:13px;background:var(--line);color:var(--ink)}
.steps li.on{color:#fff;border-color:transparent}
.steps li.on b{background:#fff}
.steps li.on[data-s="wait"]{background:var(--ink)}
.steps li.on[data-s="go"]{background:var(--go)}
.steps li.on[data-s="done"]{background:var(--done)}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl button{flex:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:34px}
.ctrl button.primary{background:var(--ink);color:#fff;min-width:84px}
.ctrl button:focus-visible,.hint button:focus-visible,#seek:focus-visible{outline:3px solid var(--plow);outline-offset:2px}
#seek{flex:1;min-width:0;accent-color:var(--ink);height:28px}
.clock{font-family:var(--font-num);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.hint{font-size:11px;line-height:1.45;color:var(--slate);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.hint button{border:0;background:none;padding:0;text-decoration:underline;font-weight:700;cursor:pointer;color:var(--ink)}
.hint button[hidden]{display:none}

@media (min-width:900px){
  .app{grid-template-columns:400px 1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"brand map" "status map" "panel map"}
  .brand{padding:20px 24px 14px;border-bottom:0}
  .brand h1{font-size:24px}
  .lead{font-size:14.5px;margin-top:4px}
  .status{padding:20px 24px 18px}
  .st-head{font-size:24px}
  .st-count strong{font-size:50px}
  .panel{border-top:0;padding:18px 24px;gap:14px;justify-content:flex-start}
  .steps{grid-template-columns:1fr}
  .steps li{font-size:14px;padding:10px 12px}
  .mapwrap{border-left:1px solid var(--line)}
}
@media (max-width:899px){
  .brand{padding:6px 12px 5px;gap:1px}
  .mark{width:22px;height:22px}
  .brand h1{font-size:16px}
  .pill{font-size:10px;padding:1px 8px}
  .lead{font-size:12px;line-height:1.4}
  .status{padding:9px 12px 7px;gap:0 10px}
  .status::before{height:4px}
  .st-chip{font-size:11px}
  .st-head{font-size:17px}
  .st-sub{font-size:11px}
  .st-count{min-width:74px}
  .st-count small{font-size:10px}
  .st-count strong{font-size:34px}
  .st-bar{height:4px;margin-top:5px}
  .toast{left:8px;right:8px;top:6px;padding:7px 9px;border-radius:12px;gap:1px 8px}
  .toast .ic{width:28px;height:28px}
  .toast .ic svg{width:18px;height:18px}
  .toast .meta{font-size:10px}
  .toast .msg{font-size:12px;line-height:1.35}
  .legend{left:6px;bottom:22px;padding:4px 8px;font-size:10px;gap:2px 8px}
  .legend i{width:14px}
  .mapfoot{left:6px;right:6px;bottom:4px;font-size:9px}
  .scale{font-size:10px}
  .panel{padding:7px 12px 7px;gap:6px}
  .steps{gap:5px}
  .steps li{padding:4px 5px;font-size:11.5px;gap:5px;white-space:nowrap;justify-content:center}
  .steps li b{width:17px;height:17px;font-size:11px}
  .ctrl{gap:6px}
  .ctrl button{padding:3px 9px;min-height:30px;font-size:12px}
  .ctrl button.primary{min-width:70px}
  .clock{font-size:15px;min-width:36px}
  #seek{height:24px}
  .hint{font-size:10px;line-height:1.35}
}
@media (max-width:899px) and (max-height:600px){.lead{display:none}.st-sub{display:none}}
@media (max-width:899px) and (max-height:470px){.hint{display:none}.legend{display:none}.brand{display:none}}
@media (prefers-reduced-motion:reduce){.toast,.status,.steps li{transition:none}.status[data-state="go"] .st-chip i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="brand-row">
      <svg class="mark" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#132231"/><path d="M5 18h9v-6l-3-3H5z" fill="#f6b400"/><path d="M15.5 9.5l4 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="19.5" r="1.8" fill="#fff"/><circle cx="12.5" cy="19.5" r="1.8" fill="#fff"/></svg>
      <h1>雪投げタイム</h1>
      <span class="pill">コンセプトデモ</span>
    </div>
    <p class="lead">除雪車が来る<b>直前の3分だけ</b>、家の前の道路に雪を出せる。その合図を届けます。</p>
  </header>

  <section class="status" id="status" data-state="wait" aria-live="polite">
    <span class="st-chip"><i></i><span id="stChip">待機中</span></span>
    <p class="st-head" id="stHead">まだ道路に雪を出さないで</p>
    <p class="st-sub" id="stSub">到着予定 6:47 ごろ。3分前に合図します</p>
    <div class="st-count"><small id="stCountLabel">除雪車の到着まで</small><strong id="stCount">7:00</strong></div>
    <div class="st-bar" aria-hidden="true"><span id="stBar"></span></div>
  </section>

  <div class="mapwrap" id="mapwrap">
    <canvas id="map" aria-label="札幌市東区元町周辺の地図。除雪車が架空のルートを走り、自宅前に近づくと雪出しOKの区間がオレンジで表示されます。"></canvas>
    <div class="toast" id="toast" role="status">
      <div class="ic"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M5 18h9v-6l-3-3H5z" fill="#f6b400"/><path d="M15.5 9.5l4 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="19.5" r="1.8" fill="#fff"/><circle cx="12.5" cy="19.5" r="1.8" fill="#fff"/></svg></div>
      <div class="meta"><span>雪投げタイム</span><span id="toastTime">6:40</span></div>
      <div class="msg" id="toastMsg"></div>
    </div>
    <div class="legend" aria-label="凡例">
      <span><i class="lg-wait"></i>これから</span>
      <span><i class="lg-go"></i>雪出しOK</span>
      <span><i class="lg-done"></i>除雪済み</span>
      <span><i class="lg-pile"></i>出された雪</span>
    </div>
    <div class="mapfoot">
      <span class="scale"><i id="scaleBar"></i><span>100 m</span></span>
      <span>札幌市東区 元町周辺　© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</span>
    </div>
  </div>

  <footer class="panel">
    <ol class="steps" id="steps">
      <li data-s="wait" class="on"><b>1</b><span>合図を待つ</span></li>
      <li data-s="go"><b>2</b><span>道路に出す</span></li>
      <li data-s="done"><b>3</b><span>除雪車が運ぶ</span></li>
    </ol>
    <div class="ctrl">
      <button class="primary" id="btnPlay" type="button">一時停止</button>
      <button id="btnRestart" type="button">最初から</button>
      <input id="seek" type="range" min="0" max="100" step="1" value="0" aria-label="デモの時刻">
      <span class="clock" id="clock">6:40</span>
    </div>
    <p class="hint"><span>架空のデモ（16倍速）。現在、道路への雪出しは禁止です。建物タップで自宅を変更できます。</span><button id="btnHome" type="button" hidden>自宅を元町図書館に戻す</button></p>
  </footer>
</div>

}
const sx=function(x){return W/2+(x-view.cx)*view.k},sy=function(y){return H/2-(y-view.cy)*view.k};
const wx=function(px){return (px-W/2)/view.k+view.cx},wy=function(py){return view.cy-(py-H/2)/view.k};
function world(){ctx.setTransform(view.k*dpr,0,0,-view.k*dpr,(W/2-view.cx*view.k)*dpr,(H/2+view.cy*view.k)*dpr)}
function screen(){ctx.setTransform(dpr,0,0,dpr,0,0)}
function strokeRange(s0,s1){
  if(s1<=s0) return;
  ctx.beginPath();let p=pointAt(s0);ctx.moveTo(p.x,p.y);
  for(let i=0;i<R.length;i++) if(cum[i]>s0&&cum[i]<s1) ctx.lineTo(R[i][0],R[i][1]);
  p=pointAt(s1);ctx.lineTo(p.x,p.y);ctx.stroke();
}
function pill(text,x,y,opt){
  ctx.font=(opt.weight||700)+' '+opt.size+'px '+getComputedStyle(document.body).fontFamily;
  const w=ctx.measureText(text).width+opt.padX*2,h=opt.size+opt.padY*2;
  ctx.fillStyle=opt.bg;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();
  ctx.fillStyle=opt.fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y+0.5);
  return {w,h};
}
let fontFamily='sans-serif';
function draw(now){
  const k=view.k,sT=Math.min(L,V*t),sGo=Math.min(L,sT+V*WINDOW),st=homeState(),pulse=0.5+0.5*Math.sin(now/260);
  screen();ctx.fillStyle='#e8edf2';ctx.fillRect(0,0,W,H);
  world();ctx.lineCap='round';ctx.lineJoin='round';
  // 道路（縁→面）
  ctx.strokeStyle='#c3cdd8';roadWidths.forEach(function(w){ctx.lineWidth=w+2.2/k;ctx.stroke(roadGroups[w])});
  ctx.strokeStyle='#fbfcfd';roadWidths.forEach(function(w){ctx.lineWidth=w;ctx.stroke(roadGroups[w])});
  // 建物
  ctx.fillStyle='#c5ced9';ctx.fill(pathBld);ctx.strokeStyle='#aeb9c6';ctx.lineWidth=0.8/k;ctx.stroke(pathBld);
  // ルート：これから
  ctx.strokeStyle='rgba(90,108,127,.75)';ctx.lineWidth=Math.max(2.2,2.4/k);ctx.setLineDash([5,5]);ctx.lineCap='butt';strokeRange(sGo,L);ctx.setLineDash([]);ctx.lineCap='round';
  // ルート：除雪済み
  ctx.strokeStyle='rgba(43,143,163,.8)';ctx.lineWidth=Math.max(4.2,3.4/k);strokeRange(0,sT);
  // ルート：雪出しOK
  ctx.strokeStyle='rgba(240,96,15,'+(0.18+0.14*pulse)+')';ctx.lineWidth=Math.max(11,9/k);strokeRange(sT,sGo);
  ctx.strokeStyle=COL.goLight;ctx.lineWidth=Math.max(5.6,4.6/k);strokeRange(sT,sGo);
  // 自宅の建物
  ctx.fillStyle=st==='go'?COL.go:st==='done'?'#17697a':COL.ink;ctx.fill(home.path);
  ctx.strokeStyle='#fff';ctx.lineWidth=1.6/k;ctx.stroke(home.path);
  ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.6/k;ctx.setLineDash([3/k,3/k]);ctx.beginPath();ctx.moveTo(home.b.cx,home.b.cy);ctx.lineTo(home.px,home.py);ctx.stroke();ctx.setLineDash([]);
  // 出された雪
  for(const p of piles){
    const eta=(p.s-sT)/V; if(p.s>sT+V*WINDOW+1) continue;
    const lead=p.home?WINDOW*0.92:p.lead; let g=0;
    if(eta>0) g=Math.max(0,Math.min(1,(lead-eta)/25)); else g=Math.max(0,1+eta/4);
    if(g<=0) continue;
    const r=Math.max((p.home?3.2:p.r)*g,(p.home?4.5:2.4)*g/k);
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.2832);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#5a6c7f';ctx.lineWidth=1.1/k;ctx.stroke();
  }
  // 画面座標の要素
  screen();
  // 自宅前の印
  const hx=sx(home.px),hy=sy(home.py);
  if(st==='go'){ctx.beginPath();ctx.arc(hx,hy,9+7*pulse,0,6.2832);ctx.strokeStyle='rgba(217,72,15,'+(0.7-0.5*pulse)+')';ctx.lineWidth=2.5;ctx.stroke()}
  // 除雪車
  const tp=pointAt(sT),tx=sx(tp.x),ty=sy(tp.y),done=t>=L/V;
  if(!done){ctx.beginPath();ctx.arc(tx,ty,15+6*pulse,0,6.2832);ctx.fillStyle='rgba(246,180,0,'+(0.28-0.16*pulse)+')';ctx.fill()}
  ctx.save();ctx.translate(tx,ty);ctx.rotate(-tp.ang);
  ctx.fillStyle='#132231';ctx.beginPath();ctx.roundRect(-13,-8,24,16,4);ctx.fill();
  ctx.fillStyle=COL.plow;ctx.beginPath();ctx.roundRect(-11.5,-6.5,21,13,3);ctx.fill();
  ctx.fillStyle='#132231';ctx.beginPath();ctx.roundRect(1,-4.5,5.5,9,1.5);ctx.fill();
  ctx.strokeStyle='#132231';ctx.lineWidth=3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(14.5,-10);ctx.lineTo(16.5,0);ctx.lineTo(14.5,10);ctx.stroke();
  ctx.fillStyle=pulse>0.5?'#d9480f':'#fff';ctx.beginPath();ctx.arc(-6,0,2.4,0,6.2832);ctx.fill();
  ctx.restore();
  pill('除雪車',tx,ty-24,{size:11,padX:7,padY:3,bg:'rgba(19,34,49,.92)',fg:'#fff'});
  // ラベル
  ctx.font='700 10.5px '+fontFamily;ctx.fillStyle='rgba(90,108,127,.95)';ctx.textAlign='center';ctx.textBaseline='middle';
  if(k>0.6&&W>=560){
    ctx.fillText('イオン札幌元町SC',sx(-91),sy(122));
    ctx.save();ctx.translate(sx(21),sy(55));ctx.rotate(-Math.atan2(210.8,-26.8)+Math.PI);ctx.fillText('東15丁目屯田通',0,0);ctx.restore();
  }
  // 自宅ラベル
  const lx=sx(home.b.cx),ly=sy(home.b.cy);
  const col=st==='go'?COL.go:st==='done'?'#17697a':COL.ink;
  let top=ly;for(let i=1;i<home.b.f.length;i+=2) top=Math.min(top,sy(home.b.f[i]));
  const main=st==='go'?(W<900?'自宅 雪を出す':'自宅　いま雪を出す'):'自宅';
  ctx.font='900 13px '+fontFamily;const mw=ctx.measureText(main).width+34,bx=Math.max(mw/2+6,Math.min(W-mw/2-6,lx)),by=top-20;
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(bx-mw/2,by-13,mw,26,13);ctx.fill();
  ctx.beginPath();ctx.moveTo(lx-6,by+12);ctx.lineTo(lx+6,by+12);ctx.lineTo(lx,by+20);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();const ix=bx-mw/2+15;ctx.moveTo(ix-6,by+1);ctx.lineTo(ix,by-6);ctx.lineTo(ix+6,by+1);ctx.lineTo(ix+4,by+1);ctx.lineTo(ix+4,by+6);ctx.lineTo(ix-4,by+6);ctx.lineTo(ix-4,by+1);ctx.closePath();ctx.fill();
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='900 13px '+fontFamily;ctx.fillText(main,ix+10,by+0.5);
  if(!homeCustom){
    const sub=W<900?'デモ用：元町図書館':'デモ用に元町図書館を自宅に設定';ctx.font='700 10.5px '+fontFamily;const sw=ctx.measureText(sub).width;
    let bottom=ly;for(let i=1;i<home.b.f.length;i+=2) bottom=Math.max(bottom,sy(home.b.f[i]));
    const sxp=Math.max(sw/2+8,Math.min(W-sw/2-8,lx));
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.textAlign='center';ctx.strokeText(sub,sxp,bottom+11);ctx.fillStyle=COL.ink;ctx.fillText(sub,sxp,bottom+11);
  }
  $scale.style.width=(100*k).toFixed(0)+'px';
}

// ---------- ループ ----------
let last=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000||0);last=now;
  if(playing){
    if(t<T_END){
      t=Math.min(T_END,t+dt*SCALE);
      toasts.forEach(function(x){if(!x.fired&&t>=x.at){x.fired=true;showToast(x.msg)}});
      if(t>=T_END) holdUntil=now+2600;
    }else if(now>=holdUntil){restart()}
  }
  updateUI();draw(now);
  requestAnimationFrame(frame);
}
function restart(){t=0;syncToasts();toasts.forEach(function(x){x.fired=false});$toast.classList.remove('show')}
function setPlaying(p){playing=p;$play.textContent=p?'一時停止':'再生';if(p&&t>=T_END)restart()}
$play.addEventListener('click',function(){setPlaying(!playing)});
el('btnRestart').addEventListener('click',function(){restart();setPlaying(true)});
$seek.addEventListener('input',function(){t=+$seek.value;syncToasts();$toast.classList.remove('show')});
el('btnHome').addEventListener('click',function(){setHome(D.home,false)});

// ---------- 地図の操作 ----------
const ptrs=new Map();let tap=null,pinch=null;
function zoomAt(px,py,f){const x=wx(px),y=wy(py);view.k=Math.max(0.4,Math.min(6,view.k*f));view.cx=x-(px-W/2)/view.k;view.cy=y+(py-H/2)/view.k;userMoved.v=true}
function local(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);const p=local(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1) tap={x:p.x,y:p.y,time:performance.now(),moved:false};
  else{tap=null;const a=[...ptrs.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
});
cv.addEventListener('pointermove',function(e){
  if(!ptrs.has(e.pointerId)) return;const prev=ptrs.get(e.pointerId),p=local(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1){
    if(tap&&Math.hypot(p.x-tap.x,p.y-tap.y)>7) tap.moved=true;
    if(!tap||tap.moved){view.cx-=(p.x-prev.x)/view.k;view.cy+=(p.y-prev.y)/view.k;userMoved.v=true}
  }else if(ptrs.size===2&&pinch){
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch.d>0) zoomAt((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,d/pinch.d);pinch.d=d;
  }
});
function up(e){
  if(!ptrs.has(e.pointerId)) return;const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);pinch=null;
  if(tap&&!tap.moved&&performance.now()-tap.time<500&&ptrs.size===0) pick(p.x,p.y);
  tap=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(e){ptrs.delete(e.pointerId);tap=null;pinch=null});
cv.addEventListener('wheel',function(e){e.preventDefault();const p=local(e);zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0015))},{passive:false});
function pick(px,py){
  world();let hit=null;
  for(const b of B){if(ctx.isPointInPath(bldPath(b),px*dpr,py*dpr)){hit=b;break}}
  screen();
  if(!hit) return;
  if(hit.dmin>14){note('除雪ルート沿いの建物を選んでください。');return}
  setHome(hit.idx,hit.idx!==D.home);
  note('ここを自宅に設定しました。到着予定は '+hhmm(START+home.s/V)+' ごろです。');
}

// ---------- 起動 ----------
setHome(D.home,false);
fontFamily=getComputedStyle(document.body).fontFamily;
new ResizeObserver(resize).observe(wrap);resize();
if(reduce){t=Math.max(0,home.s/V-WINDOW*0.6);syncToasts();setPlaying(false)}
requestAnimationFrame(function(n){last=n;frame(n)});
})();
</script>
</body>
